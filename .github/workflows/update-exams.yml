name: update-exams
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python update_exams.py
      - run: |
          git config user.name "exam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add exams.json
          git diff --cached --quiet || (git commit -m "update exams" && git push)
